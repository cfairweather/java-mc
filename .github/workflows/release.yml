name: Release

# Publish a release either way:
#   - push a tag like v1.0.0, or
#   - Actions > Release > Run workflow with version 1.0.0 (creates the tag)
# Produces:
#   - ghcr.io/<owner>/<repo>:1.0.0, :1.0, :sha-xxxxxxx and :latest
#   - a GitHub release with the core and full client packs (.mrpack)
# Pushes to main only publish :sha-xxxxxxx and :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0. Leave empty to only build and push the image."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build and push server image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="$GITHUB_REF_NAME"; else v="${INPUT_VERSION:-}"; fi
          v="${v#v}"
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a semantic version like 1.0.0"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' || github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release with client packs
    if: needs.image.outputs.version != ''
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packs
        env:
          v: ${{ needs.image.outputs.version }}
        run: |
          python3 scripts/build_mrpack.py --profile core --version "$v"
          python3 scripts/build_mrpack.py --profile full --version "$v"
      - name: Release notes
        env:
          TAGS: ${{ needs.image.outputs.tags }}
          v: ${{ needs.image.outputs.version }}
        run: |
          {
            echo "## Server image"
            echo
            echo '```'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${v}"
            echo '```'
            echo
            echo "Tags pushed:"
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
            echo
            echo "## Client packs"
            echo
            echo "- \`*-full-*.mrpack\`: everyone installs this when the server runs the full profile (default)."
            echo "- \`*-core-*.mrpack\`: optional performance mods for a server on the core profile."
            echo
            echo "Install with the Modrinth App or Prism Launcher. See docs/JOINING.md."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.image.outputs.version }}
          name: v${{ needs.image.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.mrpack
          body_path: release-notes.md
          generate_release_notes: true
